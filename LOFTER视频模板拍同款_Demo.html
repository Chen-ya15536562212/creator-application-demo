<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOFTER 视频模板 · 拍同款</title>
<style>
:root{color-scheme:dark;--accent:#5ec7c1;--muted:#afafb4;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#151718;color:#fff}
button,select,input{font:inherit}
button{cursor:pointer;border:0;color:inherit;background:none;padding:0}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid #fff;outline-offset:-3px}
button:disabled{cursor:default}
[hidden]{display:none!important}
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:30px;padding:20px}
.phone{width:min(390px,100%);height:min(844px,calc(100dvh - 40px));min-height:535px;position:relative;display:flex;flex-direction:column;background:#000;box-shadow:0 24px 75px #0008;overflow:hidden;border:1px solid #303436;border-radius:28px}
.screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.status{height:38px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 23px;font-size:13px;font-weight:700}
.status-right{display:flex;align-items:center;gap:6px}.signal{letter-spacing:-1px}.battery{background:#eee;color:#111;border-radius:4px;padding:0 4px;font-size:10px}
.poster{position:relative;flex:1;min-height:0;isolation:isolate;overflow:hidden;background:#222}
.poster>img{width:100%;height:100%;object-fit:cover;object-position:center;position:absolute;z-index:-2}
.poster::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0005 0%,transparent 20%,transparent 70%,#000d 100%)}
.poster-info{position:absolute;left:16px;right:16px;bottom:13px;display:grid;justify-items:start;gap:9px}
.watch-frame{position:relative;align-self:center;width:100%;max-width:54cqh;height:100%;overflow:hidden}
#player{container-type:size}
.watch-frame>img{display:block;width:100%;height:100%}
.watch-frame[data-layout=featured]{--author-top:85%;isolation:isolate}
.watch-frame[data-layout=featured]>#video-poster{object-fit:cover;object-position:center;position:absolute;inset:0;z-index:-2}
.watch-frame[data-layout=featured]::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0003,transparent 21%,transparent 62%,#000e 98%);z-index:-1}
.watch-work{position:absolute;left:2.8%;right:2.8%;top:var(--author-top);display:grid;gap:7px}
.watch-work .creator{font-weight:600}
.watch-work-title{font-size:16px;margin:0;line-height:1.35;overflow-wrap:anywhere}
.watch-back{position:absolute;top:4px;left:5px;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#131516d9;font-size:28px}
.watch-frame[data-layout=portrait]{--author-top:80.3%}
.bubble{position:absolute;left:2.8%;bottom:calc(100% - var(--author-top) + 8px);display:flex;align-items:center;gap:7px;padding:0 11px;max-width:94.4%;min-height:44px;font-size:13px;font-weight:650;white-space:nowrap;isolation:isolate}
.bubble::before{content:"";position:absolute;inset:5px 0;z-index:-1;border:1px solid #ffffff45;border-radius:9px;background:#181a1ae8;box-shadow:0 2px 8px #0005}
.bubble:hover::before{background:#262b2b}
.bubble>.bubble-icon{display:block;flex:none;width:18px;height:18px;border-radius:50%;object-fit:cover}
.bubble-label,.bubble-divider,.bubble-arrow{flex:none}
.bubble-divider{height:12px;border-left:1px solid #ffffff60}
.bubble-name{min-width:0;overflow:hidden;text-overflow:ellipsis}
.bubble-arrow{font-size:17px;line-height:1;color:#ddd}
.creator{display:flex;align-items:center;gap:7px;font-size:14px}
.creator img{width:24px;height:24px;object-fit:cover;border-radius:50%;border:1px solid #fff}
.poster h1{font-size:17px;margin:0}
.template-back{position:absolute;top:4px;left:5px;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:#131516d9;font-size:28px}
.player-footer{padding:5px 16px 15px}
.metadata,.hint{font-size:12px;color:var(--muted)}
.progress{height:18px;display:flex;align-items:center;margin:4px 0}
.progress i{height:2px;width:100%;background:linear-gradient(90deg,#ddd 0 64%,#575759 64%);position:relative}
.progress i:after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;left:64%;top:-2px}
.primary{min-height:42px;padding:0 16px;border-radius:999px;color:#071b19;background:var(--accent);font-weight:700;white-space:nowrap}
.primary:disabled{color:#96969c;background:#171719}
.start{width:100%;color:#fff;background:#55b8b3}
.home-indicator{flex:none;width:112px;height:4px;border-radius:5px;background:#eee;margin:4px auto 8px}
.nav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;height:47px;flex:none;padding:0 7px}
.nav h2{margin:0;text-align:center;font-size:17px}
.nav .icon{font-size:26px;height:42px}.nav .local{font-size:23px}
.tabs{display:flex;flex:none;height:41px}
.tabs button{width:50%;font-size:14px;color:var(--muted);position:relative}
.tabs button[aria-selected=true]{color:white;font-weight:650}
.tabs button[aria-selected=true]::after{content:"";width:17px;height:3px;background:var(--accent);border-radius:9px;position:absolute;bottom:0;left:calc(50% - 8px)}
.gallery{min-height:0;flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;gap:2px;overflow:auto;padding-top:2px}
.asset{aspect-ratio:1;position:relative;overflow:hidden;background:#202025}
.asset .thumb,.slot .thumb{display:block;width:100%;height:100%;object-fit:cover}
.asset:has(.badge.assigned){box-shadow:inset 0 0 0 2px var(--accent)}
.badge{position:absolute;top:5px;right:5px;display:grid;place-items:center;border:1.5px solid white;border-radius:50%;width:24px;height:24px;font-size:20px;line-height:1;background:#0005}
.badge.assigned{background:var(--accent);border-color:var(--accent);color:#12201e;font-size:11px;font-weight:750}
.duration{position:absolute;bottom:5px;right:5px;font-size:10px;padding:2px 4px;border-radius:4px;background:#000b}
.slots-panel{background:#202021;border-radius:16px 16px 0 0;padding:13px 13px 9px;flex:none}
.slots{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 7px;scrollbar-width:thin}
.slot{position:relative;flex:0 0 61px;height:63px;overflow:hidden;border:1px solid #39393c;border-radius:10px;background:#272729;color:#d0d0d3}
.slot[aria-pressed=true]{border:2px solid #fff}
.slot .seconds{position:absolute;bottom:4px;left:0;right:0;font-size:11px;text-shadow:0 1px 3px #000}
.slot.filled .seconds{background:#000a;bottom:0;padding:2px 0}
.slot .number{position:absolute;left:6px;top:4px;font-size:9px}
.slot .slot-plus{font-size:19px;position:absolute;top:14px;left:0;right:0}
.panel-actions{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:6px;min-height:42px}
.slot-info{font-size:12px;line-height:1.6;color:#cdcdcf}
.remove{color:var(--accent);padding:3px 0;font-size:12px}
.review-media{flex:1;min-height:0;position:relative;background:#131315;display:grid;place-items:center;overflow:hidden}
.review-media>*{display:block;width:100%;height:100%;min-height:0;object-fit:contain;position:absolute;inset:0}
.review-panel{padding:13px;display:grid;gap:10px;background:#202021}
.review-panel .primary{justify-self:end}
.tester{width:166px;display:grid;gap:9px;color:#dedee0;font-size:13px}
.tester select{width:100%;padding:8px;background:#232627;color:#fff;border:1px solid #43494b;border-radius:8px}
.tester small{color:#a5a8aa;line-height:1.5}
.toast{position:absolute;z-index:3;left:50%;top:50%;translate:-50% -50%;max-width:calc(100% - 34px);background:#303035f0;border:1px solid #ffffff22;border-radius:10px;padding:11px 15px;text-align:center;font-size:13px;width:max-content;pointer-events:none;box-shadow:0 8px 30px #0006}
dialog{width:calc(100% - 38px);max-width:326px;border:1px solid #444;border-radius:16px;padding:18px;background:#242427;color:#fff}
dialog::backdrop{background:#0009}.dialog-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:18px}.dialog-actions button{min-height:40px}.dialog-actions button:last-child{color:var(--accent)}
@media(max-width:660px){.stage{flex-direction:column;padding:0;gap:0}.phone{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.tester{width:100%;padding:14px 16px;grid-template-columns:auto minmax(0,1fr);align-items:center}.tester small{grid-column:1/-1}}
</style>
</head>

const shots = fixture.shots;
const featured = {title:'本人杂食程度belike', author:'朱阿伦', image:fixture.poster, avatar:fixture.avatar};
const templates = new Map([
  [1001, {name:featured.title, available:true}],
  [1002, {available:false}]
]);
const works = {
  ready:{templateId:1001},
  untagged:{},
  unavailable:{templateId:1002},
  failed:{templateId:1001, failFirstOpen:true}
};
const $ = id => document.getElementById(id);
const screens = ['player', 'template', 'picker', 'review'];
const tabs = [...document.querySelectorAll('[role="tab"]')];
let picks = shots.map(() => null);
let media = [...fixture.media];
let active = 0;
let type = 'image';
let screen = 'player';
let scenario = 'ready';
let failedOnce = false;
let toastTimer;
let session = 0;
let importing = false;
$('template-poster').src = fixture.poster;
$('template-avatar').src = fixture.avatar;
$('watch-avatar').src = featured.avatar;
$('watch-author').textContent = featured.author;
$('watch-title').textContent = featured.title;
$('metadata').textContent = `时长 00:20 · 片段 ${shots.length} 个`;
updatePlayer();

function notify(message) {
  clearTimeout(toastTimer);
  $('toast').textContent = message;
  $('toast').hidden = false;
  toastTimer = setTimeout(() => $('toast').hidden = true, 2700);
}

function show(id) {
  clearTimeout(toastTimer);
  $('toast').hidden = true;
  if (id !== 'review') $('review-media').replaceChildren();
  screens.forEach(name => $(name).hidden = name !== id);
  screen = id;
}

function updatePlayer() {
  const layout = $('layout').value;
  const isFeatured = layout === 'featured';
  const example = isFeatured ? featured : fixture.watch[layout];
  $('watch-work').hidden = !isFeatured;
  $('watch-back').hidden = !isFeatured;
  $('watch-frame').dataset.layout = layout;
  $('video-poster').src = example.image;
  $('video-poster').alt = isFeatured ? featured.title+' · 作品画面' : example.description;
  const template = resolveTemplate(works[scenario]);
  $('remake-name').textContent = template?.name ?? '';
  $('remake').hidden = !template;
}

function resolveTemplate(work) {
  const id = work.templateId;
  const numericId = typeof id === 'string' && /^\d+$/.test(id) ? Number(id) : id;
  const template = Number.isSafeInteger(numericId) ? templates.get(numericId) : null;
  return template?.available ? template : null;
}

function reset() {
  session++;
  importing = false;
  $('import').disabled = false;
  media.filter(item => item.local).forEach(item => URL.revokeObjectURL(item.src));
  media = [...fixture.media];
  picks = shots.map(() => null);
  active = 0;
  type = 'image';
}

function openTemplate() {
  const work = works[scenario];
  const template = resolveTemplate(work);
  if (!template) return;
  if (work.failFirstOpen && !failedOnce) {
    failedOnce = true;
    notify('模板加载失败，请重试');
    return;
  }
  $('template-name').textContent = template.name;
  show('template');
}

function openPicker() {
  reset();
  show('picker');
  renderPicker();
  $('gallery').scrollTop = 0;
  $('slots').scrollLeft = 0;
}

function thumbnail(item) {
  const node = document.createElement(item.local && item.type === 'video' ? 'video' : 'img');
  node.className = 'thumb';
  node.src = item.src;
  if (node instanceof HTMLVideoElement) {
    node.preload = 'metadata';
    node.muted = true;
    node.playsInline = true;
  } else {
    node.alt = '';
  }
  return node;
}

function drawSlots(container, preview) {
  const buttons = shots.map((seconds, i) => {
    const item = picks[i];
    const button = document.createElement('button');
    button.className = item ? 'slot filled' : 'slot';
    button.setAttribute('aria-pressed', i === active);
    button.setAttribute('aria-label', `镜头 ${i + 1}，${seconds} 秒，${item ? item.name : '待添加'}`);
    if (item) button.append(thumbnail(item));
    button.insertAdjacentHTML('beforeend', `<span class="number">${i + 1}</span>${item ? '' : '<span class="slot-plus">+</span>'}<span class="seconds">${seconds}s</span>`);
    button.onclick = () => {
      active = i;
      if (preview) renderReview();
      else renderPicker();
      container.children[i].focus({preventScroll:true});
    };
    return button;
  });
  container.replaceChildren(...buttons);
  const selected = buttons[active];
  const visibleArea = container.getBoundingClientRect();
  const selectedArea = selected.getBoundingClientRect();
  if (selectedArea.right > visibleArea.right) container.scrollLeft += selectedArea.right - visibleArea.right;
  if (selectedArea.left < visibleArea.left) container.scrollLeft -= visibleArea.left - selectedArea.left;
}

function renderPicker() {
  const count = picks.filter(Boolean).length;
  tabs.forEach(tab => tab.setAttribute('aria-selected', tab.dataset.type === type));
  const assets = media.filter(item => item.type === type).map(item => {
    const selected = picks.flatMap((pick, i) => pick === item ? [i + 1] : []);
    const button = document.createElement('button');
    button.className = 'asset';
    button.setAttribute('aria-label', `选择${item.name}`);
    button.append(thumbnail(item));
    const badge = document.createElement('span');
    badge.className = selected.length ? 'badge assigned' : 'badge';
    badge.textContent = selected.length ? selected.join('·') : '+';
    button.append(badge);
    if (item.type === 'video') button.insertAdjacentHTML('beforeend', `<span class="duration">${Number(item.duration.toFixed(2))}s</span>`);
    button.onclick = () => assign(item);
    return button;
  });
  $('gallery').replaceChildren(...assets);
  drawSlots($('slots'), false);
  $('slot-info').textContent = `镜头 ${active + 1} · ${shots[active]} 秒`;
  $('remove').hidden = !picks[active];
  $('next').disabled = count !== shots.length;
  $('next').textContent = `下一步 ${count}/${shots.length}`;
}

function assign(item) {
  if (item.type === 'video' && item.duration + 0.0001 < shots[active]) {
    notify(`请选择至少 ${shots[active]} 秒的视频`);
    return;
  }
  picks[active] = item;
  const next = picks.findIndex((pick, i) => i > active && !pick);
  const firstEmpty = picks.indexOf(null);
  if (next !== -1) active = next;
  else if (firstEmpty !== -1) active = firstEmpty;
  renderPicker();
}

function renderReview() {
  const item = picks[active];
  const node = thumbnail(item);
  if (node instanceof HTMLVideoElement) {
    node.controls = true;
    node.addEventListener('timeupdate', () => {
      if (node.currentTime >= shots[active]) node.pause();
    });
  }
  $('review-media').replaceChildren(node);
  $('review-info').textContent = `镜头 ${active + 1} · ${shots[active]} 秒 · ${shots.length} 个素材已选`;
  drawSlots($('review-slots'), true);
}

function readFile(file, src) {
  return new Promise((resolve, reject) => {
    if (file.type.startsWith('image/')) {
      const image = new Image();
      image.onload = () => resolve({type:'image'});
      image.onerror = reject;
      image.src = src;
      return;
    }
    if (!file.type.startsWith('video/')) {
      reject();
      return;
    }
    const video = document.createElement('video');
    video.preload = 'metadata';
    video.onloadedmetadata = () => Number.isFinite(video.duration) && video.duration > 0
      ? resolve({type:'video', duration:video.duration}) : reject();
    video.onerror = reject;
    video.src = src;
  });
}

$('remake').onclick = openTemplate;
$('template-back').onclick = () => show('player');
$('start').onclick = openPicker;
$('close').onclick = () => picks.some(Boolean) ? $('discard').showModal() : show('template');
$('keep').onclick = () => $('discard').close();
$('leave').onclick = () => {
  $('discard').close();
  reset();
  show('template');
};
tabs.forEach(tab => tab.onclick = () => {
  type = tab.dataset.type;
  renderPicker();
  $('gallery').scrollTop = 0;
});
$('remove').onclick = () => {
  picks[active] = null;
  renderPicker();
};
$('next').onclick = () => {
  if (picks.some(item => !item)) return;
  active = 0;
  show('review');
  renderReview();
};
$('edit').onclick = () => {
  show('picker');
  renderPicker();
};
$('publish').onclick = () => notify('已演示导出发布流程');
$('scenario').onchange = event => {
  scenario = event.target.value;
  restartPlayer();
};
$('layout').onchange = restartPlayer;

function restartPlayer() {
  failedOnce = false;
  reset();
  show('player');
  updatePlayer();
  $('player').scrollIntoView({block:'nearest'});
}
$('import').onclick = () => $('file').click();
$('file').onchange = async event => {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file || importing) return;
  importing = true;
  $('import').disabled = true;
  const currentSession = session;
  const src = URL.createObjectURL(file);
  try {
    const details = await readFile(file, src);
    if (screen !== 'picker' || session !== currentSession) {
      URL.revokeObjectURL(src);
      return;
    }
    media.unshift({...details, src, name:file.name, local:true});
    type = details.type;
    renderPicker();
    $('gallery').scrollTop = 0;
  } catch {
    URL.revokeObjectURL(src);
    if (screen === 'picker' && session === currentSession) notify('无法读取素材，请重新选择');
  } finally {
    if (session === currentSession) {
      importing = false;
      $('import').disabled = false;
    }
  }
};
</script>
</body>
