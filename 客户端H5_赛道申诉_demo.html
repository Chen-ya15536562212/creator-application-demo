<body>
<div class="phone">
  <div class="hero" aria-hidden="true"></div>
  <div class="launch" id="launch" hidden><button type="button" class="pill" id="start">发起赛道申诉</button></div>
  <section class="sheet" id="sheet" aria-labelledby="title">
    <header class="sheet-head"><h1 id="title" tabindex="-1"></h1><button type="button" class="close" id="close" aria-label="关闭">×</button></header>
    <div id="body" class="body"></div>
    <div id="footer" class="footer"></div>
  </section>
</div>
<script>
'use strict';
const $ = selector => document.querySelector(selector);
const tracks = ['OC','手书','AI 动画','影视混剪','Cos','同人文化','影视'];
const videos = [
  {id:'01',title:'Trouble is a friend',track:'OC',views:'852000'},
  {id:'02',title:'把今天画进分镜里',track:'手书',views:'28600'},
  {id:'03',title:'一段秋日片尾',track:'影视混剪',views:'12100'}
];
const key = 'lofter-h5-track-appeal-demo-v1';
let submissions = {};
try { submissions = JSON.parse(localStorage.getItem(key)) || {}; } catch {}
let active = videos[0];
let step = submissions[active.id] ? 'pick' : 'edit';
let target = '';
let reason = '';

function videoCard(video, selectable = false) {
  const content = `<span class="video-thumb" aria-hidden="true"></span><span class="video-copy"><span class="video-title">${video.title}</span><span class="metadata"><span class="label">${video.track}</span><span>有效播放量·${video.views}</span></span>${selectable?'<span class="date">2026/10/16 发布</span>':''}</span>`;
  if (!selectable) return `<div class="video">${content}</div>`;
  const pending = Boolean(submissions[video.id]);
  const picked = !pending && video === active;
  return `<button type="button" class="video${picked?' picked':''}" data-video="${video.id}" aria-pressed="${picked}"${pending?' disabled':''}>${content}${pending?'<span class="pending">申诉中</span>':`<span class="circle" aria-hidden="true">${picked?'✓':''}</span>`}</button>`;
}
function render() {
  const closed = step === 'closed';
  $('#sheet').hidden = closed;
  $('#launch').hidden = !closed;
  if (closed) return;
  $('#sheet').classList.toggle('edit', step === 'edit');
  $('#body').scrollTop = 0;
  if (step === 'pick') {
    $('#title').textContent = '选择要申诉的视频';
    $('#body').innerHTML = '<p class="notice">仅可对活动期内打了 #同好扶持计划# tag 的视频申诉，每条稿件仅可申诉 1 次。</p>' + videos.map(video=>videoCard(video,true)).join('');
    $('#footer').innerHTML = `<button type="button" class="pill primary" data-action="next"${!active || submissions[active.id]?' disabled':''}>下一步</button>`;
  } else if (step === 'edit') {
    $('#title').textContent = '申诉赛道';
    $('#body').innerHTML = `${videoCard(active)}
      <fieldset class="fields"><legend><span class="field-header"><span>申请调整到</span><span class="note">每条稿件仅可申诉 1 次，提交后不可修改</span></span></legend>
      <div class="chips">${tracks.map(track=>`<button type="button" class="chip" data-track="${track}" aria-pressed="${track===target}"${track===active.track?` disabled aria-label="${track}，当前赛道"`:''}>${track}</button>`).join('')}</div></fieldset>
      <div class="spacer"><label class="reason-label" for="reason">申诉理由（选填）</label><textarea class="reason" id="reason" placeholder="这条视频主要内容是…"></textarea><p class="error" id="error" role="alert" hidden></p></div>`;
    $('#reason').value = reason;
    $('#footer').innerHTML = `<button type="button" class="pill" data-action="back">上一步</button><button type="button" class="pill primary" data-action="submit"${!target?' disabled':''}>提交申诉</button>`;
  } else {
    $('#title').textContent = '申诉已提交';
    $('#body').innerHTML = '<div class="result" role="status"><strong>申诉中</strong><p id="submitted-track"></p></div>';
    $('#submitted-track').textContent = `申请调整到 ${submissions[active.id].track}`;
    $('#footer').innerHTML = '<button type="button" class="pill primary" data-action="done">返回视频列表</button>';
  }
}
function move(next) {
  step = next;
  render();
  $(step==='closed'?'#start':'#title').focus();
}
$('#body').addEventListener('click',event=>{
  const button = event.target.closest('button');
  if (!button || button.disabled) return;
  if (button.dataset.video) {
    const video = videos.find(item=>item.id===button.dataset.video);
    if (active!==video) { active=video; target=''; reason=''; }
    render();
    $(`[data-video="${active.id}"]`).focus();
  } else if (button.dataset.track && button.dataset.track!==active.track) {
    target = button.dataset.track;
    $('#body').querySelectorAll('[data-track]').forEach(chip=>chip.setAttribute('aria-pressed',String(chip.dataset.track===target)));
    $('[data-action="submit"]').disabled = false;
  }
});
$('#body').addEventListener('input',event=>{ if (event.target.id==='reason') reason = event.target.value; });
$('#footer').addEventListener('click',event=>{
  const action = event.target.closest('button')?.dataset.action;
  if ((action==='back' || action==='done')) move('pick');
  if (action==='next' && active && !submissions[active.id]) move('edit');
  if (action==='submit' && active && !submissions[active.id] && tracks.includes(target) && target!==active.track) {
    const next = {...submissions,[active.id]:{track:target,reason:reason.trim()}};
    try { localStorage.setItem(key,JSON.stringify(next)); }
    catch { $('#error').textContent='暂未保存，请重试。'; $('#error').hidden=false; return; }
    submissions=next;
    move('done');
  }
});
$('#close').onclick=()=>move('closed');
$('#start').onclick=()=>move('pick');
render();
</script>
</body>
</html>
