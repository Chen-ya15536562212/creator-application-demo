<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>创作者后台申请审核</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;font:14px 'Microsoft YaHei',sans-serif;color:#292a2f;background:#f6f7f9;display:flex}aside{width:208px;background:white;border-right:1px solid #eee;min-height:100vh;flex-shrink:0;padding:18px 12px}.brand{font-size:16px;font-weight:600;margin:0 0 27px}.nav{padding:11px;color:#666}.nav.sel{background:#f4f5ff;color:#405cff;border-radius:5px}.nav-toggle{display:flex;width:100%;align-items:center;justify-content:space-between;text-align:left;border:0;background:transparent;font:inherit;cursor:pointer}.nav-toggle .arrow{font-size:12px;transition:transform .15s}.nav-toggle[aria-expanded="true"] .arrow{transform:rotate(180deg)}.sub-muted{color:#666}.sub{padding:9px 10px 9px 25px;color:#5363ea;font-size:13px}main{padding:26px 30px;min-width:0;flex:1}.crumb{color:#aaa;font-size:13px}.panel{background:#fff;margin-top:26px;padding:20px 22px;border-radius:7px}h2{font-size:20px;margin:24px 0}.banner{background:#f2f5ff;color:#5d70a6;padding:9px 12px;margin-bottom:16px}.tabs{display:flex;gap:28px;border-bottom:1px solid #eee}.tab{border:0;background:white;padding:12px 0;color:#444;cursor:pointer}.tab.active{border-bottom:2px solid #4e5dfc;color:#4e5dfc}.filters{display:flex;flex-wrap:wrap;gap:10px;padding:20px 0}.filters input,.filters select,button,textarea{font:inherit;border:1px solid #dedfe5;border-radius:4px;padding:8px;background:white;color:#444}input,select{height:35px}input[type=date]{width:142px}input.small{width:120px}button{cursor:pointer}.primary{background:#495eff;color:white;border-color:#495eff}.filter-wrap{display:inline-block;position:relative;margin-left:5px;width:18px;height:22px;vertical-align:middle}.header-filter{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.filter-icon{display:block;color:#8b90a0;font-size:14px;line-height:22px;text-align:center;pointer-events:none}.filter-value{color:#4a60e9;font-weight:normal;margin-left:3px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1150px}th,td{text-align:left;padding:15px 11px;border-bottom:1px solid #eee;font-size:13px}th{background:#f8f8f9;white-space:nowrap}td{line-height:1.5}small{color:#999}a,.link{color:#4a60e9;cursor:pointer;text-decoration:none;background:none;border:0;padding:0;margin-right:10px}footer{text-align:right;color:#999;padding:20px}.mask{display:none;position:fixed;inset:0;background:#0006;justify-content:center;align-items:center}.mask.open{display:flex}.modal{width:600px;max-height:85vh;overflow:auto;background:white;border-radius:6px;padding:24px}.modal h3{margin:0 0 15px}.row{display:flex;border-bottom:1px solid #eee;padding:10px 0}.label{color:#999;width:155px;flex-shrink:0}.bodytext{white-space:pre-wrap;overflow-wrap:anywhere}.foot{text-align:right;margin-top:20px}.foot button{margin-left:8px}.tip{font-size:12px;color:#999}.empty{text-align:center;color:#999;padding:60px}textarea{width:100%;resize:vertical}</style></head><body><aside><div class="brand">◉ 创作者运营工作台</div><div class="nav">◷ 我的工作台</div><div class="nav">☆ 核心作者池</div><div class="nav">ϟ 快捷查询</div><div class="nav">♧ 站外运营</div><div class="nav">⌕ 创作者搜索</div><div class="nav">◇ 创作者标签</div><div class="nav">♧ 运营工具箱</div><button class="nav nav-toggle" type="button" aria-expanded="false" aria-controls="eco-menu">♢ 创作者生态 <span class="arrow">⌄</span></button><div id="eco-menu" class="nav-children" hidden><div class="sub sub-muted">达人认证</div></div><button class="nav nav-toggle sel" type="button" aria-expanded="false" aria-controls="review-menu">▣ 视频业务处理 <span class="arrow">⌄</span></button><div id="review-menu" class="nav-children" hidden><div class="sub">创作者后台申请</div></div></aside><main><div class="crumb">视频业务处理 / 创作者后台申请</div><h2>创作者后台申请</h2><div class="panel"><div class="banner">演示数据：审核结果仅保存在当前浏览器，不会开通真实权限。</div><div class="tabs" id="tabs"><button class="tab active" data-status="待审核">待审核</button><button class="tab" data-status="已通过">已通过</button><button class="tab" data-status="不通过">不通过</button></div><div class="filters"><input id="uid" class="small" placeholder="用户 ID"><input id="blog" placeholder="博客链接"><span>提交时间</span><input id="start" type="date"><span>至</span><input id="end" type="date"><input id="operator" class="small" placeholder="操作人"><span>操作时间</span><input id="opstart" type="date"><span>至</span><input id="opend" type="date"><button class="primary" id="search">查询</button><button id="reset">重置</button></div><div id="error" style="color:#d44"></div><div class="tablewrap"><table><thead><tr><th>用户 / ID</th><th>提交时间</th><th><span>粉丝≥3000</span><span class="filter-wrap"><select id="answer" class="header-filter" aria-label="筛选粉丝量"><option value="">全部</option><option>是</option><option>否</option></select><span class="filter-icon" aria-hidden="true">▾</span></span><span class="filter-value" id="answer-value"></span></th><th><span>平台</span><span class="filter-wrap"><select id="platform" class="header-filter" aria-label="筛选平台"><option value="">全部</option><option>抖音</option><option>小红书</option><option>快手</option><option>B站</option><option>其他</option></select><span class="filter-icon" aria-hidden="true">▾</span></span><span class="filter-value" id="platform-value"></span></th><th>联系方式</th><th>LOFTER 主页</th><th>个人主页截图</th><th>后台数据截图</th><th>操作人</th><th>操作时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><footer id="count"></footer></div></main><div id="mask" class="mask"><div class="modal"><h3 id="title"></h3><div id="details"></div><div id="actions" class="foot"></div></div></div><script>
document.querySelectorAll('.nav-toggle').forEach(btn=>btn.addEventListener('click',()=>{const target=document.getElementById(btn.getAttribute('aria-controls'));const expanded=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',String(!expanded));target.hidden=expanded}));
const seed=[{id:'1972193102',name:'小岛创作',date:'2026-11-10 10:30',answer:'是',platform:['小红书','B站'],other:'',contact:'示例账号01',blog:'https://example.lofter.com',pic1:'示例个人主页截图',pic2:'示例后台数据截图',status:'待审核',operator:'',time:''},{id:'2365435929',name:'小森林',date:'2026-11-09 15:20',answer:'否',platform:[],other:'',contact:'示例账号02',blog:'https://forest.lofter.com',pic1:'',pic2:'',status:'待审核',operator:'',time:''},{id:'2876590211',name:'绘光',date:'2026-11-08 12:20',answer:'是',platform:['其他'],other:'示例平台',contact:'示例账号03',blog:'https://demo.lofter.com',pic1:'示例个人主页截图',pic2:'示例后台数据截图',status:'已通过',operator:'运营小林',time:'2026-11-09 11:20'}];let data;try{data=JSON.parse(localStorage.getItem('creator-review-v2'))||seed}catch{data=seed}let status='待审核',f={};const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function matches(x){return x.status===status&&(!f.uid||x.id.includes(f.uid))&&(!f.blog||x.blog.includes(f.blog))&&(!f.answer||x.answer===f.answer)&&(!f.platform||x.platform.includes(f.platform))&&(!f.operator||x.operator.includes(f.operator))&&(!f.start||x.date.slice(0,10)>=f.start)&&(!f.end||x.date.slice(0,10)<=f.end)&&(!f.opstart||(x.time&&x.time.slice(0,10)>=f.opstart))&&(!f.opend||(x.time&&x.time.slice(0,10)<=f.opend))}function render(){let list=data.filter(matches);$('#rows').innerHTML=list.length?list.map(x=>`<tr><td>${esc(x.name)}<br><small>${esc(x.id)}</small></td><td>${esc(x.date)}</td><td>${esc(x.answer)}</td><td>${esc(x.platform.join('、')||'—')}${x.other?'（'+esc(x.other)+'）':''}</td><td>${esc(x.contact)}</td><td><button class="link" data-detail="${x.id}">查看</button></td><td>${x.pic1?'示例图':'—'}</td><td>${x.pic2?'示例图':'—'}</td><td>${esc(x.operator||'—')}</td><td>${esc(x.time||'—')}</td><td><button class="link" data-detail="${x.id}">详情</button>${x.status==='待审核'?`<button class="link" data-act="通过" data-id="${x.id}">通过</button><button class="link" data-act="不通过" data-id="${x.id}">不通过</button>`:'—'}</td></tr>`).join(''):'<tr><td colspan="11" class="empty">暂无符合条件的申请</td></tr>';$('#count').textContent='共 '+list.length+' 条'}$('#tabs').onclick=e=>{if(!e.target.dataset.status)return;document.querySelector('.tab.active').classList.remove('active');e.target.classList.add('active');status=e.target.dataset.status;render()};$('#search').onclick=()=>{let a={};['uid','blog','start','end','answer','platform','operator','opstart','opend'].forEach(k=>a[k]=$('#'+k).value.trim());if((a.start&&a.end&&a.start>a.end)||(a.opstart&&a.opend&&a.opstart>a.opend)){$('#error').textContent='开始日期不能晚于结束日期';return}$('#error').textContent='';f=a;render()};['answer','platform'].forEach(k=>$('#'+k).addEventListener('change',()=>{f[k]=$('#'+k).value;$('#'+k+'-value').textContent=f[k]?' '+f[k]:'';render()}));$('#reset').onclick=()=>{document.querySelectorAll('.filters input,.filters select,.header-filter').forEach(x=>x.value='');['answer','platform'].forEach(k=>$('#'+k+'-value').textContent='');f={};$('#error').textContent='';render()};function close(){$('#mask').classList.remove('open')}function open(x){$('#title').textContent='申请详情';let values=[['用户',x.name+'（'+x.id+'）'],['提交时间',x.date],['是否有粉丝≥3000账号',x.answer],['符合条件的平台',x.platform.join('、')+(x.other?'（'+x.other+'）':'')],['vx/QQ 联系方式',x.contact],['LOFTER 主页链接',x.blog],['个人主页截图',x.pic1],['后台数据截图',x.pic2],['操作人',x.operator],['操作时间',x.time],['审核状态',x.status]];$('#details').innerHTML=values.map(([k,v])=>`<div class="row"><span class="label">${k}</span><span class="bodytext">${esc(v||'—')}</span></div>`).join('')+'<p class="tip">截图和链接均为模拟资料。</p>';$('#actions').innerHTML='<button id="close">关闭</button>'+(x.status==='待审核'?'<button id="reject">不通过</button><button id="approve" class="primary">通过</button>':'');$('#close').onclick=close;if(x.status==='待审核'){$('#approve').onclick=()=>act(x,'通过');$('#reject').onclick=()=>act(x,'不通过')}$('#mask').classList.add('open')}function act(x,a){$('#title').textContent='确认'+a;$('#details').innerHTML='<p>'+ (a==='通过'?'通过后将触发创作者平台权限开通。':'确认将该申请设为不通过？')+'</p><p class="tip">仅模拟状态变更，未连接真实审核或权限接口。</p>';$('#actions').innerHTML='<button id="cancel">取消</button><button id="confirm" class="primary">确认</button>';$('#cancel').onclick=close;$('#confirm').onclick=()=>{if(x.status!=='待审核'){close();render();return}x.status=a==='通过'?'已通过':'不通过';x.operator='演示运营';let t=new Date();x.time=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');localStorage.setItem('creator-review-v2',JSON.stringify(data));close();render()};$('#mask').classList.add('open')}$('#rows').onclick=e=>{let id=e.target.dataset.detail||e.target.dataset.id;if(!id)return;let x=data.find(x=>x.id===id);if(e.target.dataset.act)act(x,e.target.dataset.act);else open(x)};render();</script></body></html>
